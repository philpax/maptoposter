[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maptoposter"
version = "0.1.0"
description = "Generate beautiful city‑map posters"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Catherine Gilbert", email = "git@olaren.dev"}
]

dependencies = [
    "osmnx>=2.0",
    "matplotlib>=3.10",
    "rich>=14.3"
]

[project.scripts]
maptoposter = "maptoposter.__main__:main"

